<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Harita Denemesi</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4e3c8; font-family: system-ui, sans-serif; }
  #harita { position: fixed; inset: 0; }
  .ust { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .secici { display: flex; background: rgba(30, 30, 30, 0.75); border-radius: 10px; padding: 3px; }
  .secici button { border: 0; background: transparent; color: #fff; font: 600 14px system-ui, sans-serif; padding: 8px 12px; border-radius: 8px; }
  .secici button[aria-pressed="true"] { background: #fff; color: #222; }
  #joystick { position: fixed; left: 24px; bottom: max(24px, env(safe-area-inset-bottom)); width: 120px; height: 120px; border-radius: 50%;
    background: rgba(30, 30, 30, 0.35); border: 2px solid rgba(255, 255, 255, 0.6); touch-action: none; display: none; }
  #joystick .topuz { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255, 255, 255, 0.85); }
  #bilgi { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: rgba(30, 30, 30, 0.85); color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: 15px; opacity: 0; transition: opacity 0.2s; pointer-events: none; max-width: 80vw; text-align: center; }
  #bilgi.acik { opacity: 1; }
  #durum { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center;
    background: #f4e3c8; color: #333; font-size: 17px; text-align: center; padding: 24px; }
  #durum[hidden] { display: none; }
  #durum button { font: 600 15px system-ui, sans-serif; padding: 10px 18px; border-radius: 8px; border: 0; background: #333; color: #fff; }
</style>
</head>
<body>
<div id="harita"></div>
<div class="ust">
  <div class="secici" id="mod-secici">
    <button data-mod="kus" aria-pressed="true">Kuşbakışı</button>
    <button data-mod="takip" aria-pressed="false">Takip</button>
  </div>
  <div class="secici" id="konum-secici">
    <button data-serbest="false" aria-pressed="false">GPS</button>
    <button data-serbest="true" aria-pressed="true">Serbest</button>
  </div>
</div>
<div id="joystick"><div class="topuz"></div></div>
<div id="bilgi"></div>
<div id="durum"><span id="durum-yazi">Harita yükleniyor…</span></div>

<script type="module">
  const KUTUPHANE = { enlem: 39.89576, boylam: 32.78321 };
  const parametre = new URLSearchParams(location.search);
  const durum = document.getElementById('durum');
  const durumYazi = document.getElementById('durum-yazi');
  let hazir = false;

  function hataGoster(mesaj) {
    durumYazi.textContent = mesaj;
    if (!durum.querySelector('button')) {
      const dugme = document.createElement('button');
      dugme.textContent = 'Yeniden dene';
      dugme.onclick = () => location.reload();
      durum.appendChild(dugme);
    }
    durum.hidden = false;
  }

  let bilgiZamanlayici;
  function bilgiGoster(yazi) {
    const kutu = document.getElementById('bilgi');
    kutu.textContent = yazi;
    kutu.classList.add('acik');
    clearTimeout(bilgiZamanlayici);
    bilgiZamanlayici = setTimeout(() => kutu.classList.remove('acik'), 2500);
  }

  const zamanAsimi = setTimeout(() => {
    if (!hazir) hataGoster('Harita açılamadı: zaman aşımı. Bağlantını kontrol edip yeniden dene.');
  }, 20000);

  let haritaBaslat, koordinat;
  try {
    [{ haritaBaslat }, koordinat] = await Promise.all([import('./api.js'), import('../ortak/koordinat.js')]);
  } catch (e) {
    console.error(e);
    clearTimeout(zamanAsimi);
    hataGoster('Harita dosyaları indirilemedi. Bağlantını kontrol edip yeniden dene.');
    throw e;
  }
  const { mesafeMetre, enlemBoylamdanDunyaya, dunyadanEnlemBoylama, BLOK_METRE } = koordinat;

  const konumModu = parametre.get('konum'); // 'gercek' | 'sahte' | null
  let harita;
  try {
    harita = await haritaBaslat(document.getElementById('harita'), { baslangic: KUTUPHANE, mod: 'kus' });
  } catch (e) {
    console.error(e);
    clearTimeout(zamanAsimi);
    hataGoster(e.message || 'Harita açılamadı.');
    throw e;
  }

  harita.on('hazir', () => { hazir = true; clearTimeout(zamanAsimi); durum.hidden = true; });
  harita.on('hata', ({ mesaj }) => hataGoster(mesaj));
  harita.on('hediye-tiklandi', ({ id }) => bilgiGoster(`Hediye ${id} tıklandı`));

  // --- Düğmeler ---
  const joystickKutu = document.getElementById('joystick');
  function modSec(mod) {
    harita.kameraModu(mod);
    for (const b of document.querySelectorAll('#mod-secici button')) b.setAttribute('aria-pressed', String(b.dataset.mod === mod));
    joystickKutu.style.display = mod === 'takip' ? 'block' : 'none';
  }
  function serbestSec(acik) {
    harita.serbestGezinti(acik);
    for (const b of document.querySelectorAll('#konum-secici button')) b.setAttribute('aria-pressed', String(b.dataset.serbest === String(acik)));
  }
  for (const b of document.querySelectorAll('#mod-secici button')) b.onclick = () => modSec(b.dataset.mod);
  for (const b of document.querySelectorAll('#konum-secici button')) b.onclick = () => serbestSec(b.dataset.serbest === 'true');
  serbestSec(!konumModu);

  // --- Joystick ---
  const topuz = joystickKutu.querySelector('.topuz');
  let joystickParmak = null;
  function joystickGuncelle(e) {
    const r = joystickKutu.getBoundingClientRect();
    const yaricap = r.width / 2;
    let dx = e.clientX - (r.left + yaricap), dy = e.clientY - (r.top + yaricap);
    const d = Math.hypot(dx, dy);
    if (d > yaricap) { dx *= yaricap / d; dy *= yaricap / d; }
    topuz.style.transform = `translate(${dx}px, ${dy}px)`;
    harita.hareketGirdisi({ ileri: -dy / yaricap, yan: dx / yaricap });
  }
  joystickKutu.addEventListener('pointerdown', (e) => {
    joystickParmak = e.pointerId;
    joystickKutu.setPointerCapture(e.pointerId);
    joystickGuncelle(e);
  });
  joystickKutu.addEventListener('pointermove', (e) => { if (e.pointerId === joystickParmak) joystickGuncelle(e); });
  const joystickBirak = (e) => {
    if (e.pointerId !== joystickParmak) return;
    joystickParmak = null;
    topuz.style.transform = '';
    harita.hareketGirdisi({ ileri: 0, yan: 0 });
  };
  joystickKutu.addEventListener('pointerup', joystickBirak);
  joystickKutu.addEventListener('pointercancel', joystickBirak);

  // --- Örnek hediyeler: alınabilirlik gerçek (ya da sahte) GPS konumuna göre, karakterin konumuna göre değil ---
  let gpsSon = KUTUPHANE;
  let ornekHediyeler = [];
  if (parametre.get('hediye') === 'ornek') {
    const merkez = enlemBoylamdanDunyaya(KUTUPHANE.enlem, KUTUPHANE.boylam);
    const kaymalar = [[12, 8], [-25, 20], [40, -35], [-60, -50], [90, 30]]; // [doğu, kuzey] metre
    ornekHediyeler = kaymalar.map(([dogu, kuzey], i) => ({
      id: i + 1,
      ...dunyadanEnlemBoylama(merkez.x + dogu / BLOK_METRE, merkez.z - kuzey / BLOK_METRE),
    }));
  }
  function hediyeleriYenile() {
    if (!ornekHediyeler.length) return;
    let enYakin = null, enYakinMesafe = Infinity;
    for (const h of ornekHediyeler) {
      const d = mesafeMetre(gpsSon, h);
      if (d < enYakinMesafe) { enYakin = h; enYakinMesafe = d; }
    }
    harita.hediyeleriGoster(ornekHediyeler.map((h) => ({ ...h, alinabilir: h === enYakin && enYakinMesafe <= 30 })));
  }
  hediyeleriYenile();

  function konumGeldi(konum) {
    gpsSon = konum;
    harita.gpsKonumu(konum);
    hediyeleriYenile();
  }

  // --- Konum ---
  if (konumModu === 'gercek') {
    if (!window.isSecureContext) {
      bilgiGoster('Konum yalnızca HTTPS bağlantısında çalışır.');
    } else if (!('geolocation' in navigator)) {
      bilgiGoster('Bu tarayıcı konum vermiyor.');
    } else {
      navigator.geolocation.watchPosition(
        (p) => {
          if (p.coords.accuracy > 100) return;
          konumGeldi({ enlem: p.coords.latitude, boylam: p.coords.longitude, dogruluk: p.coords.accuracy });
        },
        (e) => bilgiGoster(
          e.code === 1 ? 'Konum izni verilmedi.' : e.code === 3 ? 'Konum alınamadı: zaman aşımı.' : 'Konum alınamıyor.'),
        { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 },
      );
    }
  } else if (konumModu === 'sahte') {
    // Kütüphane'nin 25 m güneyinden başlayıp 80 m yarıçaplı bir çemberde 1,3 m/s yürür.
    const merkez = enlemBoylamdanDunyaya(KUTUPHANE.enlem, KUTUPHANE.boylam);
    const basX = merkez.x, basZ = merkez.z + 25 / BLOK_METRE;
    const r = 80 / BLOK_METRE, acisalHiz = 1.3 / 80;
    const baslangicZamani = performance.now();
    const adim = () => {
      const t = (performance.now() - baslangicZamani) / 1000;
      const a = t * acisalHiz;
      const x = basX + r - r * Math.cos(a);
      const z = basZ - r * Math.sin(a);
      konumGeldi({ ...dunyadanEnlemBoylama(x, z), dogruluk: 5 });
    };
    adim();
    setInterval(adim, 1000);
  }
</script>
</body>
</html>
